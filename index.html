<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #333;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>
    
    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Laptop Dell XPS 15</td>
            <td>35.000.000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Điện thoại iPhone 15 Pro Max</td>
            <td>29.500.000 VNĐ</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Tai nghe Bluetooth Sony WH-1000XM5</td>
            <td>7.200.000 VNĐ</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Bàn phím cơ Keychron K8 Pro</td>
            <td>2.200.000 VNĐ</td>
            <td>15</td>
        </tr>
    </table>

</body>
</html>
